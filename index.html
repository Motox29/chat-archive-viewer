<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Archive Viewer – for exported WhatsApp chats</title>
<meta name="description" content="Chat Archive Viewer: free, open-source offline viewer for exported WhatsApp chats (WhatsApp chat export / backup ZIP). Read chats like on your phone with photos, videos and voice messages – runs entirely in your browser.">
<meta name="keywords" content="WhatsApp chat viewer, WhatsApp export viewer, WhatsApp chat archive, WhatsApp Chat anzeigen, WhatsApp Export öffnen, voice messages, opus">
<style>
/* VOICE: warm, private, familiar – like opening your phone
   IDEA: a messenger screen, rebuilt for the desktop
   PICTURE: the chat with photos and voice messages fills the screen
   COLOUR and TYPE: cool blue-grey wallpaper, light-blue outgoing bubbles, blue accent; system UI font
   LAYOUT: centred start card; then header, chat column up to 920px, overlays for media */
:root{color-scheme:light dark;
--bg:light-dark(#e7eef7,#0a1220);--panel:light-dark(#f2f6fb,#172234);--ink:light-dark(#0f1b2a,#e6edf6);--mut:light-dark(#5d6d80,#93a5ba);
--in:light-dark(#ffffff,#1c293d);--out:light-dark(#d4e6ff,#1c4c8f);--acc:#3b82f6;--acc2:light-dark(#1d5fc4,#79b0ff);--btn:light-dark(#1d5fc4,#2f6fd6);--line:light-dark(#d2dcea,#2a3b54);
--chip:light-dark(#fffffff0,#142033f0);--mark:light-dark(#ffe58a,#8a6d00);--ph:light-dark(#d9e3f0,#18243a);--dot:light-dark(#1d3a6614,#ffffff09)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
svg{fill:currentColor}
/* Start */
#start{height:100%;overflow:auto;display:grid;place-items:center;padding:24px 16px;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:24px 24px}
.card{width:min(560px,100%);background:var(--in);border-radius:20px;padding:clamp(22px,5vw,40px);box-shadow:0 1px 2px #0000001a,0 16px 48px #00000024}
.logo{width:64px;height:64px;color:var(--acc)}
h1{font-size:34px;line-height:1.05;margin:14px 0 8px;text-wrap:balance}
.lead{margin:0;color:var(--mut);font-size:16px}
.drop{margin:22px 0 14px;border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;color:var(--mut);transition:.15s}
.drop.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent);color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.pri,.sec{border-radius:24px;padding:11px 20px;min-height:44px;font-weight:600}
.pri{background:var(--btn);color:#fff;border:0}.sec{background:transparent;border:1px solid var(--line)}
.recent{display:flex;width:100%;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--acc) 8%,transparent);text-align:left}
.recent b{display:block}.recent small{color:var(--mut)}
.err{color:#d93a3a;margin:14px 0 0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.lang{font-size:14px;color:var(--mut);display:flex;align-items:center;gap:6px}
.lang select{font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:40px}
.foot{font-size:13px;color:var(--mut);margin:10px 0 0}.foot a{color:inherit}
details{margin-top:18px;color:var(--mut)}summary{cursor:pointer;color:var(--ink);font-weight:600;padding:6px 0}details ol{padding-left:20px;margin:6px 0}details li{margin:4px 0}
.small{font-size:13px;color:var(--mut);margin:16px 0 0;display:flex;gap:8px;align-items:center}.small svg{width:16px;height:16px;flex:none}
/* App */
#app{height:100%;display:flex;flex-direction:column;position:relative}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:62px;position:relative;z-index:5}
.avatar{width:42px;height:42px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:600;font-size:18px;flex:none}
.who{flex:1;display:flex;flex-direction:column;overflow:hidden;margin-left:4px}
.who b{font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:44px;height:44px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--mut);flex:none}
.ico:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}.ico svg{width:22px;height:22px}
.sbar{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.sbar input{flex:1;font-size:16px;padding:9px 14px;border-radius:20px;border:1px solid var(--line);background:var(--in);min-height:40px}
#qn{font-size:13px;color:var(--mut);white-space:nowrap;padding:0 6px;font-variant-numeric:tabular-nums}
.menu{position:absolute;right:10px;top:60px;z-index:9;background:var(--in);border-radius:12px;box-shadow:0 8px 30px #0000003a;padding:8px;width:min(300px,calc(100vw - 20px));display:grid;gap:2px}
.menu label{display:grid;gap:4px;padding:8px 10px;font-size:13px;color:var(--mut)}
.menu select,.menu input{font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:40px}
.menu button{text-align:left;border:0;background:transparent;padding:11px 10px;border-radius:8px;min-height:44px}
.menu button:hover{background:var(--panel)}
.warn{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:light-dark(#fff6d6,#3a3214);color:var(--ink);font-size:13.5px;border-bottom:1px solid var(--line)}
.warn p{margin:0;flex:1}.warn .ico{width:32px;height:32px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:24px 24px}
.chat{max-width:920px;margin:0 auto;padding:6px clamp(8px,4vw,60px) 28px}
.day{content-visibility:auto;contain-intrinsic-size:auto 900px}
.dchip{position:sticky;top:6px;z-index:2;display:flex;justify-content:center;margin:12px 0 8px;pointer-events:none}
.dchip span{background:var(--chip);color:var(--mut);font-size:12.5px;padding:5px 12px;border-radius:8px;box-shadow:0 1px .5px #0000001a}
.sys{margin:8px auto;max-width:86%;width:fit-content;text-align:center;font-size:12.5px;color:var(--mut);background:var(--chip);padding:6px 12px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;margin-top:2px}.row.first{margin-top:10px}.row.out{justify-content:flex-end}
.b{position:relative;max-width:min(80%,560px);background:var(--in);border-radius:8px;padding:6px 8px 7px 9px;box-shadow:0 1px .5px #00000021}
.out .b{background:var(--out)}
.first.in .b{border-top-left-radius:0}.first.out .b{border-top-right-radius:0}
.first .b::before{content:"";position:absolute;top:0;width:8px;height:13px;background:inherit}
.first.in .b::before{left:-8px;clip-path:polygon(100% 0,0 0,100% 100%)}
.first.out .b::before{right:-8px;clip-path:polygon(0 0,100% 0,0 100%)}
.nm{font-size:13px;font-weight:600;margin-bottom:2px}
.tx{white-space:pre-wrap;overflow-wrap:anywhere}
.tx a{color:light-dark(#027eb5,#53bdeb)}
.tx.big{font-size:40px;line-height:1.15}
.meta{float:right;margin:7px 0 -5px 12px;font-size:11px;color:var(--mut);white-space:nowrap;position:relative;top:3px}
.meta.ov{position:absolute;float:none;right:8px;bottom:7px;top:auto;margin:0;color:#fff;background:#0000006b;padding:1px 6px;border-radius:8px}
.b.m{padding:3px}.b.m .tx{padding:4px 6px 3px}
.med{display:block;position:relative;width:min(300px,62vw);aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--ph);border:0;padding:0}
.med img,.med video{width:100%;height:100%;object-fit:cover;display:block}
.med.vid{aspect-ratio:16/9;background:#000}
.bad::after{content:var(--badtxt);position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--mut);padding:8px;text-align:center}
.vn{display:flex;align-items:center;gap:6px;width:min(330px,64vw);padding:2px 2px 0}
.vn .mic{width:18px;height:18px;color:var(--acc);flex:none;margin-left:2px}
.pp{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--mut);display:grid;place-items:center;flex:none}
.pp svg{width:30px;height:30px}.pp .ps,.playing .pp .pl{display:none}.playing .pp .ps{display:block}
.pr{flex:1;accent-color:var(--acc);height:20px;margin:0 4px;cursor:pointer}
.dur{font-size:12px;color:var(--mut);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.sp{border:0;background:color-mix(in srgb,var(--ink) 10%,transparent);border-radius:12px;font-size:12px;padding:4px 8px;min-width:40px;min-height:28px;font-weight:600;color:var(--mut)}
.vn.bad{position:relative;opacity:.6}
.doc{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:8px;padding:10px;width:min(300px,62vw);text-decoration:none;color:inherit}
.doc svg{width:32px;height:32px;flex:none;color:#e5534b}.doc b{display:block;font-weight:500;overflow-wrap:anywhere}.doc small{color:var(--mut)}
.miss{display:flex;gap:6px;align-items:center;color:var(--mut);font-style:italic;font-size:14px;padding-right:4px}.miss svg{width:16px;height:16px;flex:none}
.mt{text-align:right;font-size:11px;color:var(--mut);margin:-2px 0 -2px}
.del .tx{color:var(--mut);font-style:italic}
.ed{font-style:italic;margin-right:4px}
.stk{position:relative;width:150px;height:150px}.stk img{width:100%;height:100%;object-fit:contain}
.flash .b,.flash.sys{animation:fl 1.8s ease-out}
@keyframes fl{0%,35%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:0 0 0 0 transparent}}
mark{background:var(--mark);color:inherit;border-radius:2px}
.down{position:absolute;right:18px;bottom:20px;width:46px;height:46px;border-radius:50%;border:0;background:var(--in);color:var(--mut);box-shadow:0 2px 8px #0000003a;display:grid;place-items:center}
.down svg{width:24px;height:24px}
/* Galerie */
.ovl{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:none;border:0;background:transparent;padding:12px 14px;min-height:46px;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--acc2);border-color:var(--acc)}
.gbody{flex:1;overflow-y:auto;padding:8px clamp(8px,3vw,32px) 30px;max-width:1100px;width:100%;margin:0 auto}
.gbody h3{font-size:14px;color:var(--mut);margin:18px 2px 8px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:3px}
.gi{position:relative;aspect-ratio:1;border:0;padding:0;background:var(--ph);overflow:hidden;border-radius:3px}
.gi img,.gi video{width:100%;height:100%;object-fit:cover;display:block}
.gi .play{position:absolute;inset:auto auto 6px 6px;width:22px;height:22px;color:#fff;filter:drop-shadow(0 1px 2px #000)}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--in);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.li .when{font-size:13px;color:var(--mut);min-width:150px}
.li .vn{flex:1;width:auto;min-width:220px}
.li .jump{border:0;background:transparent;color:var(--acc2);font-weight:600;padding:8px;min-height:40px}
.mhelp{background:var(--in);border-radius:12px;padding:14px 16px;margin:8px 0 14px;display:grid;gap:10px}
.mhelp p{margin:0;max-width:70ch}.mhelp .row2{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.mhelp label{display:flex;gap:8px;align-items:center;min-height:44px}
code{font-family:ui-monospace,Consolas,monospace;font-size:13.5px;background:var(--panel);border:1px solid var(--line);padding:2px 7px;border-radius:6px;user-select:all;white-space:nowrap}
.mday{background:var(--in);border-radius:10px;padding:8px 14px 6px;margin-bottom:8px}
.mday.done{opacity:.5}
.mhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;min-height:44px}
.mhead b{font-weight:600;flex:1;min-width:200px}
.mhead label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mut);cursor:pointer;min-height:40px}
.mhead input{width:20px;height:20px;accent-color:var(--acc)}
.mrow{display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,1.6fr) auto;gap:4px 10px;align-items:center;font-size:14px;color:var(--mut);border-top:1px solid var(--line)}
.mrow .jump,.li .jump{border:0;background:transparent;color:var(--acc2);font-weight:600;padding:6px 8px;min-height:40px}
@media(max-width:600px){.mrow{grid-template-columns:48px minmax(0,1fr) auto}.mrow .fn{grid-column:1/-1;grid-row:2;padding-bottom:6px}}
.empty{color:var(--mut);padding:40px 0;text-align:center}
/* Lightbox */
.lb{position:fixed;inset:0;z-index:30;background:#0b0f12f7;color:#fff;display:grid;grid-template-rows:auto minmax(0,1fr)}
.lbbar{display:flex;align-items:center;gap:8px;padding:8px 10px}
.lbbar .ico{color:#fff}.lbbar .ico:hover{background:#ffffff1f}
.lbcap{flex:1;overflow:hidden}.lbcap b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lbcap span{font-size:13px;opacity:.75}
.lbc{display:grid;place-items:center;padding:0 56px 20px;min-height:0}
.lbc img,.lbc video{max-width:100%;max-height:100%;object-fit:contain;display:block}
.lbtx{grid-row:3;text-align:center;padding:0 16px 18px;white-space:pre-wrap}
.nav{position:absolute;top:50%;translate:0 -50%;width:48px;height:48px;border-radius:50%;border:0;background:#ffffff26;color:#fff;display:grid;place-items:center}
.nav svg{width:28px;height:28px}#lbP{left:6px}#lbN{right:6px}
.busy{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 80%,transparent)}
.busy div{display:flex;gap:12px;align-items:center;background:var(--in);padding:16px 22px;border-radius:14px;box-shadow:0 8px 30px #0003}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp 1s linear infinite}
@keyframes sp{to{rotate:1turn}}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:50;background:#111b21;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 6px 24px #0004}
@media(max-width:600px){.lbc{padding:0 6px 16px}.nav{top:auto;bottom:14px;translate:none}.li .when{min-width:0;width:100%}.b{max-width:88%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

async function readZip(file){

  const tail=new DataView(await file.slice(size-tailLen).arrayBuffer());

  const cd=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer());

    while(e+4<=eEnd){const id=cd.getUint16(e,true),len=cd.getUint16(e+2,true);
      if(id===1){let q=e+4;if(unc===0xFFFFFFFF){unc=Number(cd.getBigUint64(q,true));q+=8}if(comp===0xFFFFFFFF){comp=Number(cd.getBigUint64(q,true));q+=8}if(off===0xFFFFFFFF){off=Number(cd.getBigUint64(q,true))}}

async function zipBlob(file,en,type){

function parse(text){
  const raw=[];
  for(const L of text.split(/\r?\n/)){
    const l=L.replace(CLEAN,'').replace(/[\u00a0\u202f]/g,' ');const m=HDR.exec(l);
    if(m)raw.push({m,rest:m[8]});else if(raw.length)raw[raw.length-1].rest+='\n'+L.replace(CLEAN,'')}
  let ymd=false,dmy=false,mdy=false;
  for(const r of raw){const a=+r.m[1],b=+r.m[2];if(r.m[1].length===4)ymd=true;else if(a>12)dmy=true;else if(b>12)mdy=true}
  const order=ymd?'ymd':(mdy&&!dmy)?'mdy':'dmy';
  return raw.map(r=>{const m=r.m;let d,mo,y;
    if(order==='ymd'){y=+m[1];mo=+m[2];d=+m[3]}else if(order==='mdy'){mo=+m[1];d=+m[2];y=+m[3]}else{d=+m[1];mo=+m[2];y=+m[3]}
    if(y<100)y+=2000;let h=+m[4];const ap=m[7]&&m[7].replace(/[.\s]/g,'').toLowerCase();
    if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;
    let s=null,body=r.rest;const sm=/^([^:\n]{1,80}?):\s([\s\S]*)$/.exec(body)||/^([^:\n]{1,80}?):()$/.exec(body);
    if(sm){if(/Ende-zu-Ende-verschlüsselt|end-to-end encrypted/i.test(body))body=sm[2];else{s=sm[1].trim();body=sm[2]}}
    return{t:new Date(y,mo-1,d,h,+m[5],+(m[6]||0)).getTime(),day:y+'-'+pad(mo)+'-'+pad(d),time:pad(h)+':'+m[5],s,body}})}
const ATT=/<(?:Anhang|attached|anexo|allegato|pièce jointe|bijlage|ek|załącznik)\s*:\s*([^>]+)>/i;
const ANDR=/^([^\n]+?\.[A-Za-z0-9]{2,5}) \(([^)\n]{3,40})\)[ \t]*\n?/;
const ATTWORD=/angehängt|attached|adjunto|anexado|joint|allegato|bijgevoegd/i;
const OMIT=/^(?:<(?:Medien ausgeschlossen|Media omitted|Multimedia omitido|Mídia oculta|Médias omis)>|(?:Bild|Foto|Video|Audio|Sticker|GIF|Dokument|Kontaktkarte|image|video|audio|sticker|GIF|document|Contact card) (?:weggelassen|omitted))$/i;
const DEL=/^(?:Diese Nachricht wurde gelöscht\.?|Du hast diese Nachricht gelöscht\.?|This message was deleted\.?|You deleted this message\.?)$/i;
const EDIT=/\s*<(?:Diese Nachricht wurde bearbeitet|This message was edited)>\s*$/i;

/* ---------- State ---------- */
let stats={media:0,missing:0},baseTitle='',entries=null,msgs=[],senders=[],me=null,group=false,chatKey='',hits=[],hi=-1,marked=null,rate=1,galTab='pic';
const urls=new Map();
function urlFor(name){if(!urls.has(name)){const e=entries.get(name);urls.set(name,e.blob(MIME[ext(name)]||'application/octet-stream').then(b=>URL.createObjectURL(b)))}return urls.get(name)}
function loadEl(el){if(!el._p){el._p=urlFor(el.dataset.f).then(u=>{el.src=u});el._p.catch(()=>{const b=el.closest('.med,.vn,.stk,.gi');if(b)b.classList.add('bad')})}return el._p}
const io=new IntersectionObserver(es=>{for(const en of es)if(en.isIntersecting){const t=en.target;io.unobserve(t);loadEl(t.classList.contains('vn')?t.querySelector('audio'):t).catch(()=>{})}},{rootMargin:'700px 0px'});
const observe=root=>root.querySelectorAll('.lz').forEach(el=>io.observe(el.tagName==='AUDIO'?el.closest('.vn'):el));

function busy(t){$('#busy').hidden=!t;if(t)$('#busyT').textContent=t}
let tt;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,4200)}
function showErr(t){const e=$('#err');e.textContent=t;e.hidden=!t}

async function openSource(label,ents,handle){
  showErr('');busy(T('reading'));
  try{
    const txts=[...ents.values()].filter(e=>/\.txt$/i.test(e.name)).sort((a,b)=>b.size-a.size).slice(0,10);
    if(!txts.length)throw new Error(T('e_notxt'));
    let best=null,bs=0;
    for(const e of txts){const t=(await (await e.blob('text/plain')).text());const sc=countHeaders(t);
      const pref=/^_chat\.txt$|whatsapp/i.test(base(e.name))?1000:0;if(sc>0&&sc+pref>bs){bs=sc+pref;best={e,t}}}
    if(!best)throw new Error(T('e_format'));
    entries=ents;urls.forEach(p=>p.then(u=>URL.revokeObjectURL(u)).catch(()=>{}));urls.clear();
    build(best.t,best.e.name,label);
    if(handle)saveHandle(handle,label);
  }catch(e){console.error(e);showErr(e.message||String(e))}finally{busy('')}}

function build(text,txtName,label){
  msgs=parse(text);
  if(!msgs.length)throw new Error(T('e_nomsg'));
  const cnt=new Map();msgs.forEach(m=>{if(m.s!=null)cnt.set(m.s,(cnt.get(m.s)||0)+1)});
  for(const[s,c]of[...cnt])if(c<=2&&s.split(/\s+/).length>=5){msgs.forEach(m=>{if(m.s===s){m.body=s+': '+m.body;m.s=null}});cnt.delete(s)}
  senders=[...cnt].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);group=senders.length>2;
  const byBase=new Map();for(const[k,e]of entries){const b=base(k);if(!byBase.has(b))byBase.set(b,e);if(!byBase.has(b.toLowerCase()))byBase.set(b.toLowerCase(),e)}
  const find=n=>{n=n.trim();return byBase.get(n)||byBase.get(n.toLowerCase())||null};
  let missing=0,media=0;
  msgs.forEach(m=>{let b=m.body;
    if(EDIT.test(b)){m.edited=true;b=b.replace(EDIT,'')}
    let x;
    if((x=ATT.exec(b))){m.file=find(x[1]);if(!m.file)m.missing=x[1].trim();b=(b.slice(0,x.index)+b.slice(x.index+x[0].length)).trim()}
    else if((x=ANDR.exec(b))){const f=find(x[1]);if(f||ATTWORD.test(x[2])){m.file=f;if(!f)m.missing=x[1].trim();b=b.slice(x[0].length)}}
    else{const first=b.split('\n')[0].trim();if(/^\S+\.[A-Za-z0-9]{2,5}$/.test(first)){const f=find(first);if(f&&!/\.txt$/i.test(first)){m.file=f;b=b.slice(b.indexOf(first)+first.length).trim()}}}
    const ln=b.trim().split('\n');
    if(OMIT.test(ln[0].trim())){m.omit=true;b=ln.slice(1).join('\n').trim();if(/^\S+\.[A-Za-z0-9]{2,5}$/.test(b)){m.missing=b;b=''}}
    else if(m.s!=null&&b.trim()==='null'&&!m.file){m.gone=true;b=''}
    if(DEL.test(b.trim()))m.del=true;
    if(m.file&&b.trim()===base(m.file.name))b='';
    m.text=b;m.kind=m.file?kindOf(m.file.name):null;
    if(m.file)media++;if(m.omit||m.missing)missing++});
  const nameSrc=base(txtName)+' '+label;
  const cm=/(?:WhatsApp[- _]?Chat[- _]?(?:mit|with|com|con|avec|met)[ _]+|WhatsApp Chat - )(.+?)(?:\s*\(\d+\))?(?:\.txt|\.zip)?(?:\s|$)/i.exec(base(txtName))||/(?:WhatsApp[- _]?Chat[- _]?(?:mit|with|com|con|avec|met)[ _]+|WhatsApp Chat - )(.+?)(?:\s*\(\d+\))?(?:\.txt|\.zip)?$/i.exec(label);
  let chatName=cm?cm[1].replace(/_/g,' ').trim():'';
  chatKey='me:'+(chatName||senders.join('|'));
  me=store.get(chatKey);let needMe=false;
  if(!senders.includes(me)){me=null;
    if(chatName&&senders.length===2){const hit=senders.find(s=>s===chatName)||senders.find(s=>s.includes(chatName)||chatName.includes(s));if(hit)me=senders.find(s=>s!==hit)}
    if(!me){me=senders[1]||senders[0]||'';needMe=senders.length>1}}
  if(!chatName)chatName=senders.filter(s=>s!==me).join(', ')||'Chat';
  baseTitle=chatName;setTitle();
  $('#swap').hidden=senders.length<2;
  $('#me').innerHTML=senders.map(s=>`<option${s===me?' selected':''}>${esc(s)}</option>`).join('');
  const jd=$('#jd');jd.min=msgs[0].day;jd.max=msgs[msgs.length-1].day;jd.value='';
  stats={media,missing};refreshHeader();
  $('#start').hidden=true;$('#app').hidden=false;closeSearch();
  render();toBottom();
  if(needMe){openMenu(true);toast(T('whoami'))}}

/* ---------- Rendering ---------- */
function dayLabel(t){const d=new Date(t);d.setHours(0,0,0,0);const n=new Date();n.setHours(0,0,0,0);const diff=Math.round((n-d)/864e5);return diff===0?T('today'):diff===1?T('yesterday'):fDay.format(d)}
const URLRE=/\bhttps?:\/\/[^\s<]+[^\s<.,;:!?)\]'"]/g;
function fmt(s){let h=esc(s).replace(URLRE,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  for(const[c,t]of[['\\*','b'],['_','i'],['~','s']])h=h.replace(new RegExp(`(^|[\\s(])${c}(?=\\S)([^${c}\\n]*?\\S)${c}(?=$|[\\s.,!?:;)])`,'gm'),`$1<${t}>$2</${t}>`);return h}
const seg=typeof Intl.Segmenter==='function'?new Intl.Segmenter('de',{granularity:'grapheme'}):null;
const EMO=/^[\p{Extended_Pictographic}\p{Emoji_Modifier}\p{Regional_Indicator}\u200d\ufe0f\u20e3\s]+$/u;
const isBig=s=>!!s&&s.length<=40&&EMO.test(s)&&(seg?[...seg.segment(s.replace(/\s/g,''))].length:s.length)<=3;
const icon=(id,c='')=>`<svg class="${c}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const vnHtml=(m,i)=>`<div class="vn" data-i="${i}">${icon('mic','mic')}<button class="pp" aria-label="${T('play')}">${icon('play','pl')}${icon('pause','ps')}</button><input class="pr" type="range" min="0" max="1000" value="0" aria-label="${T('pos')}"><span class="dur"></span><button class="sp" aria-label="${T('speed')}">${rate}×</button><audio class="lz" data-f="${esc(m.file.name)}" preload="metadata"></audio></div>`;
const docHtml=m=>`<a class="doc" href="#" data-f="${esc(m.file.name)}">${icon('doc')}<span><b>${esc(base(m.file.name).replace(/^\d{8}-/,''))}</b><small>${ext(m.file.name).toUpperCase()} · ${fsize(m.file.size)}</small></span></a>`;
function mediaHtml(m,i){const f=esc(m.file.name);
  switch(m.kind){
    case'img':return`<button class="med img" data-i="${i}" aria-label="${T('viewPhoto')}"><img class="lz" data-f="${f}" alt=""></button>`;
    case'vid':return`<div class="med vid"><video class="lz" data-f="${f}" controls preload="metadata" playsinline></video></div>`;
    case'aud':return vnHtml(m,i);
    default:return docHtml(m)}}
function bubble(m,i,out,first){
  const meta=`${m.edited?'<span class="ed">'+T('edited')+'</span>':''}${m.time}`;
  if(m.kind==='stk')return`<div class="stk"><img class="lz" data-f="${esc(m.file.name)}" alt="${T('sticker')}"><span class="meta ov">${meta}</span></div>`;
  const nm=(!out&&group&&first)?`<div class="nm" style="color:${colorOf(m.s)}">${esc(m.s)}</div>`:'';
  let body='',cls='b';
  if(m.file){const vis=m.kind==='img'||m.kind==='vid';if(vis)cls+=' m';body+=mediaHtml(m,i);
    if(!m.text&&vis)return`<div class="${cls}">${nm}${body}<span class="meta ov">${meta}</span></div>`}
  else if(m.missing||m.omit||m.gone){body+=`<div class="miss">${icon('off')}${m.gone?T('gone'):m.missing?esc(T('notIn',{f:m.missing})):T('omitted')}</div>`}
  const big=isBig(m.text);
  if(m.text||!body)body+=`<div class="tx${big?' big':''}">${fmt(m.text)}<span class="meta">${meta}</span></div>`;
  else body+=`<div class="mt">${meta}</div>`;
  return`<div class="${cls}${m.del?' del':''}">${nm}${body}</div>`}
function render(){
  const P=[];let lastDay='',lastS;
  msgs.forEach((m,i)=>{
    if(m.day!==lastDay){if(lastDay)P.push('</section>');P.push(`<section class="day" data-day="${m.day}"><div class="dchip"><span>${dayLabel(m.t)}</span></div>`);lastDay=m.day;lastS=undefined}
    if(m.s==null){P.push(`<div class="sys" id="m${i}">${fmt(m.body)}</div>`);lastS=undefined;return}
    const out=m.s===me,first=m.s!==lastS;lastS=m.s;
    P.push(`<div class="row ${out?'out':'in'}${first?' first':''}" id="m${i}">${bubble(m,i,out,first)}</div>`)});
  P.push('</section>');
  const c=$('#chat');c.innerHTML=P.join('');observe(c);marked=null}
const sc=()=>$('#scroll');
function toBottom(){const s=sc();s.scrollTop=s.scrollHeight;requestAnimationFrame(()=>{s.scrollTop=s.scrollHeight;requestAnimationFrame(()=>s.scrollTop=s.scrollHeight)})}
function toTop(){const s=sc();s.scrollTop=0;requestAnimationFrame(()=>s.scrollTop=0)}
function jumpTo(i){const el=document.getElementById('m'+i);if(!el)return;
  el.scrollIntoView({block:'center'});requestAnimationFrame(()=>{el.scrollIntoView({block:'center'});setTimeout(()=>el.scrollIntoView({block:'center'}),120)});
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}

/* ---------- Search ---------- */
function openSearch(){$('#sbar').hidden=false;$('#q').focus();$('#q').select()}
function closeSearch(){$('#sbar').hidden=true;$('#q').value='';hits=[];unmark();$('#qn').textContent=''}
function unmark(){if(marked!=null){const m=msgs[marked],el=document.querySelector('#m'+marked+' .tx');if(el){const meta=el.querySelector('.meta');el.innerHTML=fmt(m.text);if(meta)el.append(meta)}marked=null}}
function doSearch(){const q=$('#q').value.trim().toLowerCase();lastQ=q;unmark();hits=[];
  if(q.length<2){$('#qn').textContent='';return}
  msgs.forEach((m,i)=>{const s=((m.s==null?m.body:m.text)+' '+(m.file?base(m.file.name):'')+' '+(m.missing||'')).toLowerCase();if(s.includes(q))hits.push(i)});
  hi=hits.length-1;showHit()}
function showHit(){unmark();if(!hits.length){$('#qn').textContent=T('noHits');return}
  $('#qn').textContent=(hits.length-hi)+' / '+hits.length;const i=hits[hi],m=msgs[i];
  const q=$('#q').value.trim();const el=document.querySelector('#m'+i+' .tx');
  if(el&&m.text){const meta=el.querySelector('.meta');const rx=new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');el.innerHTML=esc(m.text).replace(rx,'<mark>$&</mark>');if(meta)el.append(meta);marked=i}
  jumpTo(i)}
function step(d){if(!hits.length)return;hi=(hi+d+hits.length)%hits.length;showHit()}
let qT,lastQ='';
$('#q').addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(doSearch,250)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){closeSearch();return}if(e.key!=='Enter')return;e.preventDefault();clearTimeout(qT);
  if($('#q').value.trim().toLowerCase()!==lastQ)doSearch();else step(e.shiftKey?1:-1)});
$('#sBtn').onclick=()=>$('#sbar').hidden?openSearch():closeSearch();
$('#qUp').onclick=()=>step(-1);$('#qDn').onclick=()=>step(1);$('#qX').onclick=closeSearch;

/* ---------- Menu ---------- */
function openMenu(v){$('#menu').hidden=!v;$('#mBtn').setAttribute('aria-expanded',String(v))}
$('#mBtn').onclick=e=>{e.stopPropagation();openMenu($('#menu').hidden)};
document.addEventListener('click',e=>{if(!$('#menu').hidden&&!e.target.closest('#menu,#mBtn'))openMenu(false)});
function setTitle(){let t=baseTitle;if(senders.length===2&&!group){const o=senders.find(x=>x!==me);if(o&&baseTitle!==o&&senders.includes(baseTitle))t=o}
  $('#title').textContent=t;document.title=T('chatWith',{n:t});const av=$('#av');av.textContent=[...t][0]||'?';av.style.background=colorOf(t)}
function refreshHeader(){const{media,missing}=stats;
  $('#sub').textContent=T('sub',{n:num(msgs.length),a:fShort.format(msgs[0].t),b:fShort.format(msgs[msgs.length-1].t)})+(media?T('subMedia',{m:num(media)}):'');
  const w=[];
  if(msgs.length>=39900||(msgs.length>=9900&&media))w.push(T('w_limit'));
  if(missing)w.push(T('w_missing',{n:num(missing)}));
  $('#warnT').textContent=w.join(' ');$('#warn').hidden=!w.length||store.get('warn:'+chatKey)==='1';setTitle()}
function anchor(){const s=sc(),top=s.getBoundingClientRect().top;
  for(const sec of document.querySelectorAll('#chat section')){if(sec.getBoundingClientRect().bottom<=top+30)continue;
    for(const el of sec.querySelectorAll('.row,.sys')){const r=el.getBoundingClientRect();if(r.bottom>top+30)return{id:el.id,off:r.top-top}}}return null}
function setMe(v){const a=anchor();me=v;store.set(chatKey,me);$('#me').value=me;setTitle();render();
  if(a){const el=document.getElementById(a.id);if(el){const s=sc();s.scrollTop+=el.getBoundingClientRect().top-s.getBoundingClientRect().top-a.off}}
  if(!$('#gal').hidden)renderGal()}
$('#me').onchange=e=>setMe(e.target.value);
$('#swap').onclick=()=>{if(senders.length<2)return;const n=senders[(senders.indexOf(me)+1)%senders.length];setMe(n);toast(T('persp',{n}))};
$('#jd').onchange=e=>{const v=e.target.value;if(!v)return;let i=msgs.findIndex(m=>m.day>=v);if(i<0)i=msgs.length-1;openMenu(false);
  const sec=document.querySelector(`section[data-day="${msgs[i].day}"]`);if(sec){sec.scrollIntoView({block:'start'});requestAnimationFrame(()=>sec.scrollIntoView({block:'start'}))}};
$('#toTop').onclick=()=>{openMenu(false);toTop()};$('#toEnd').onclick=()=>{openMenu(false);toBottom()};
function home(){openMenu(false);$('#app').hidden=true;$('#gal').hidden=true;$('#start').hidden=false;document.title=T('docTitle');document.querySelectorAll('audio').forEach(a=>a.pause());$('#chat').innerHTML='';showRecent()}
$('#back').onclick=home;$('#other').onclick=home;$('#warnX').onclick=()=>{$('#warn').hidden=true;store.set('warn:'+chatKey,'1')};
sc().addEventListener('scroll',()=>{const s=sc();$('#down').hidden=s.scrollHeight-s.scrollTop-s.clientHeight<500},{passive:true});
$('#down').onclick=toBottom;

/* ---------- Media: lazy loading, player, documents ---------- */
document.addEventListener('load',e=>{const t=e.target;if(t.tagName==='IMG'){const b=t.closest('.med');if(b&&t.naturalWidth)b.style.aspectRatio=Math.min(1.8,Math.max(.62,t.naturalWidth/t.naturalHeight))}},true);
document.addEventListener('loadedmetadata',e=>{const t=e.target;
  if(t.tagName==='VIDEO'){const b=t.closest('.med');if(b&&t.videoWidth)b.style.aspectRatio=Math.min(1.8,Math.max(.62,t.videoWidth/t.videoHeight))}
  if(t.tagName==='AUDIO'){const v=t.closest('.vn');if(v&&t.paused&&!t.currentTime)v.querySelector('.dur').textContent=mmss(t.duration)}},true);
document.addEventListener('timeupdate',e=>{const a=e.target;if(a.tagName!=='AUDIO')return;const v=a.closest('.vn');if(!v)return;
  if(isFinite(a.duration)&&a.duration>0&&!v._drag)v.querySelector('.pr').value=Math.round(a.currentTime/a.duration*1000);v.querySelector('.dur').textContent=mmss(a.currentTime)},true);
for(const ev of['play','pause'])document.addEventListener(ev,e=>{const a=e.target;if(a.tagName!=='AUDIO')return;const v=a.closest('.vn');if(v)v.classList.toggle('playing',!a.paused)},true);
document.addEventListener('ended',e=>{const a=e.target;if(a.tagName!=='AUDIO')return;const v=a.closest('.vn');if(!v)return;
  v.querySelector('.pr').value=0;v.querySelector('.dur').textContent=mmss(a.duration);a.currentTime=0;
  const i=+v.dataset.i;if(msgs[i+1]&&msgs[i+1].kind==='aud'){const nx=v.closest('.chat,.gbody').querySelector(`.vn[data-i="${i+1}"]`);if(nx)playVn(nx)}},true);
async function playVn(v){const a=v.querySelector('audio');
  try{await loadEl(a);if(a.paused){document.querySelectorAll('audio,video').forEach(x=>{if(x!==a&&!x.paused)x.pause()});a.playbackRate=rate;await a.play()}else a.pause()}
  catch(err){console.error(err);v.classList.add('bad');toast(T('cantPlay'))}}
document.addEventListener('input',e=>{const r=e.target;if(!r.classList.contains('pr'))return;const v=r.closest('.vn'),a=v.querySelector('audio');
  loadEl(a).then(()=>{const go=()=>{if(isFinite(a.duration))a.currentTime=r.value/1000*a.duration};a.readyState?go():a.addEventListener('loadedmetadata',go,{once:true})}).catch(()=>{})});
document.addEventListener('pointerdown',e=>{const r=e.target.closest('.pr');if(r)r.closest('.vn')._drag=true});
document.addEventListener('pointerup',()=>document.querySelectorAll('.vn').forEach(v=>v._drag=false));
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,a');if(!t)return;
  if(t.classList.contains('pp')){playVn(t.closest('.vn'));return}
  if(t.classList.contains('sp')){rate=rate===1?1.5:rate===1.5?2:1;document.querySelectorAll('.sp').forEach(b=>b.textContent=rate+'×');document.querySelectorAll('audio').forEach(a=>a.playbackRate=rate);return}
  if(t.classList.contains('img')&&t.dataset.i){openLb(+t.dataset.i);return}
  if(t.classList.contains('gi')){openLb(+t.dataset.i);return}
  if(t.classList.contains('jump')){closeGal();jumpTo(+t.dataset.i);return}
  if(t.classList.contains('doc')&&t.dataset.f&&t.getAttribute('href')==='#'){e.preventDefault();
    try{const u=await urlFor(t.dataset.f);t.href=u;t.target='_blank';t.rel='noopener';t.download=base(t.dataset.f);t.click()}catch(err){toast(T('cantOpen'))}}});

/* ---------- Gallery ---------- */
function openGal(){document.querySelectorAll('#chat audio').forEach(a=>a.pause());$('#gal').hidden=false;renderGal()}
function closeGal(){document.querySelectorAll('#gal audio,#gal video').forEach(a=>a.pause());$('#gal').hidden=true;$('#gbody').innerHTML=''}
function renderGal(){
  const pick={pic:m=>m.kind==='img'||m.kind==='vid',aud:m=>m.kind==='aud',doc:m=>m.kind==='doc',miss:m=>!m.file&&!m.gone&&(m.omit||!!m.missing)};
  const n={};for(const k in pick)n[k]=msgs.filter(pick[k]).length;
  document.querySelectorAll('.tabs button').forEach(b=>{const k=b.dataset.t;b.setAttribute('aria-selected',String(k===galTab));b.textContent=T('tab_'+k)+` (${num(n[k])})`});
  $('#galSub').textContent=$('#title').textContent;
  const list=[];msgs.forEach((m,i)=>{if(pick[galTab](m))list.push(i)});if(galTab!=='miss')list.reverse();
  const P=[];
  if(!list.length)P.push(`<p class="empty">${T('empty')}</p>`);
  else if(galTab==='pic'){let mon='';list.forEach(i=>{const m=msgs[i],mo=fMon.format(m.t);if(mo!==mon){if(mon)P.push('</div>');P.push(`<h3>${mo}</h3><div class="grid">`);mon=mo}
      P.push(m.kind==='img'?`<button class="gi" data-i="${i}" aria-label="${T('photoFrom',{d:fWhen.format(m.t)})}"><img class="lz" data-f="${esc(m.file.name)}" alt=""></button>`
        :`<button class="gi" data-i="${i}" aria-label="${T('videoFrom',{d:fWhen.format(m.t)})}"><video class="lz" data-f="${esc(m.file.name)}" muted preload="metadata"></video>${icon('play','play')}</button>`)});P.push('</div>')}
  else if(galTab==='miss')missHtml(list,P);
  else list.forEach(i=>{const m=msgs[i];P.push(`<div class="li"><span class="when">${fWhen.format(m.t)}<br>${esc(m.s||'')}</span>${galTab==='aud'?vnHtml(m,i):docHtml(m)}<button class="jump" data-i="${i}">${T('inChat')}</button></div>`)});
  const g=$('#gbody');g.innerHTML=P.join('');g.scrollTop=0;observe(g)}
const ymd=d=>d.replace(/-/g,'');
const foundKey=d=>'found:'+chatKey+':'+d;
const who=s=>s===me?T('you'):(s||'');
function missDays(list){const days=new Map();list.forEach(i=>{const m=msgs[i];if(!days.has(m.day))days.set(m.day,[]);days.get(m.day).push(i)});return days}
function missHtml(list,P){
  const days=missDays(list);let done=0;days.forEach((_,d)=>{if(store.get(foundKey(d))==='1')done++});
  P.push(`<div class="mhelp"><p>${T('missHelp',{n:num(list.length),d:num(days.size)})}</p>
  <div class="row2"><button class="sec" id="copyMiss">${T('copyList')}</button><label><input type="checkbox" id="hideDone"${store.get('hideDone')==='1'?' checked':''}> ${T('hideDone')}</label><span style="color:var(--mut);font-size:14px">${T('doneOf',{a:num(done),b:num(days.size)})}</span></div></div>`);
  const hide=store.get('hideDone')==='1';
  days.forEach((is,d)=>{const f=store.get(foundKey(d))==='1';if(f&&hide)return;
    P.push(`<div class="mday${f?' done':''}"><div class="mhead"><b>${fDay.format(msgs[is[0]].t)}</b><code>${ymd(d)}</code><label><input type="checkbox" class="found" data-day="${d}"${f?' checked':''}> ${T('found')}</label></div>`);
    is.forEach(i=>{const m=msgs[i];P.push(`<div class="mrow"><span>${m.time}</span><span>${esc(who(m.s))}</span><span class="fn">${m.missing?esc(m.missing):T('unknownFile')}</span><button class="jump" data-i="${i}">${T('inChat')}</button></div>`)});
    P.push('</div>')})}
document.addEventListener('change',e=>{const t=e.target;
  if(t.classList.contains('found')){store.set(foundKey(t.dataset.day),t.checked?'1':'0');const st=$('#gbody').scrollTop;renderGal();$('#gbody').scrollTop=st}
  if(t.id==='hideDone'){store.set('hideDone',t.checked?'1':'0');renderGal()}});
document.addEventListener('click',async e=>{if(!e.target.closest('#copyMiss'))return;
  const list=[];msgs.forEach((m,i)=>{if(!m.file&&!m.gone&&(m.omit||m.missing))list.push(i)});
  const L=[T('listHead',{t:$('#title').textContent}),''];
  missDays(list).forEach((is,d)=>{const by=new Map();is.forEach(i=>{const w=msgs[i].s;by.set(w,(by.get(w)||0)+1)});const named=is.map(i=>msgs[i].missing).filter(Boolean);
    L.push(T('listLine',{d:fShort.format(msgs[is[0]].t),s:ymd(d),n:is.length,f:T(is.length>1?'fileN':'file1'),by:[...by].map(([w,n])=>n+'× '+(w===me?T('byYou'):T('byX',{n:w}))).join(', ')})+(named.length?'  ['+named.join(', ')+']':'')+(store.get(foundKey(d))==='1'?'  '+T('foundMark'):''))});
  try{await navigator.clipboard.writeText(L.join('\n'));toast(T('copied'))}catch(err){toast(T('copyFail'))}});
$('#gBtn').onclick=openGal;$('#galX').onclick=closeGal;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#gal audio').forEach(a=>a.pause());galTab=b.dataset.t;renderGal()});

/* ---------- Lightbox ---------- */
let lbList=[],lbPos=0;
function openLb(i){lbList=[];msgs.forEach((m,k)=>{if(m.kind==='img'||m.kind==='vid')lbList.push(k)});lbPos=lbList.indexOf(i);if(lbPos<0)return;
  document.querySelectorAll('audio,video').forEach(a=>a.pause());$('#lb').hidden=false;showLb()}
async function showLb(){const i=lbList[lbPos],m=msgs[i],c=$('#lbc');c.innerHTML='<span class="spin"></span>';
  $('#lbW').textContent=(m.s||'')+(m.text?' – '+m.text.split('\n')[0]:'');$('#lbD').textContent=T('lbPos',{d:fWhen.format(m.t),a:num(lbPos+1),b:num(lbList.length)});
  $('#lbP').disabled=lbPos===0;$('#lbN').disabled=lbPos===lbList.length-1;
  try{const u=await urlFor(m.file.name);if(lbList[lbPos]!==i)return;const el=document.createElement(m.kind==='img'?'img':'video');el.src=u;el.alt='';
    if(m.kind==='vid'){el.controls=true;el.autoplay=true;el.playsInline=true}c.replaceChildren(el)}catch(e){c.textContent=T('loadErr')}}
function lbStep(d){const n=lbPos+d;if(n<0||n>=lbList.length)return;lbPos=n;showLb()}
function closeLb(){$('#lb').hidden=true;$('#lbc').innerHTML=''}
$('#lbX').onclick=closeLb;$('#lbP').onclick=()=>lbStep(-1);$('#lbN').onclick=()=>lbStep(1);
$('#lbJ').onclick=()=>{const i=lbList[lbPos];closeLb();closeGal();jumpTo(i)};
$('#lbc').addEventListener('click',e=>{if(e.target===e.currentTarget)closeLb()});
document.addEventListener('keydown',e=>{
  if(!$('#lb').hidden){if(e.key==='ArrowLeft')lbStep(-1);else if(e.key==='ArrowRight')lbStep(1);else if(e.key==='Escape')closeLb();return}
  if(e.key==='Escape'){if(!$('#gal').hidden)closeGal();else if(!$('#menu').hidden)openMenu(false);else if(!$('#sbar').hidden)closeSearch()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'&&!$('#app').hidden&&$('#gal').hidden){e.preventDefault();openSearch()}});

/* ---------- Opening files ---------- */
let canFSA=false;try{canFSA='showOpenFilePicker' in window&&window.top===window}catch(e){}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('chat-archiv',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function saveHandle(h,label){try{const db=await idb();db.transaction('h','readwrite').objectStore('h').put({h,label,when:Date.now()},'last')}catch(e){}}
async function getHandle(){try{const db=await idb();return await new Promise(res=>{const r=db.transaction('h').objectStore('h').get('last');r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}catch(e){return null}}
async function showRecent(){const b=$('#recent');const rec=canFSA?await getHandle():null;
  if(!rec||!rec.h){b.hidden=true;return}b.hidden=false;b.innerHTML=`${icon('chat','logo" style="width:36px;height:36px;flex:none')}<span><b>${esc(T('recent',{n:rec.label}))}</b><small>${T('recentHint')}</small></span>`;
  b.onclick=async()=>{try{const o={mode:'read'};if(await rec.h.queryPermission(o)!=='granted'&&await rec.h.requestPermission(o)!=='granted')return;
    const f=await rec.h.getFile();await openFile(f,rec.h)}catch(e){showErr(T('e_gone'))}}}
async function openFile(f,handle){
  if(/\.txt$/i.test(f.name))return openSource(f.name,new Map([[f.name,fileEntry(f)]]),handle);
  let ents;try{busy(T('opening',{n:f.name}));ents=await readZip(f)}catch(e){busy('');showErr(e.message);return}
  return openSource(f.name,ents,handle)}
$('#pickZip').onclick=async()=>{
  if(canFSA){try{const[h]=await window.showOpenFilePicker({types:[{description:T('fileType'),accept:{'application/zip':['.zip'],'text/plain':['.txt']}}]});await openFile(await h.getFile(),h);return}
    catch(e){if(e&&e.name==='AbortError')return}}
  $('#zipIn').click()};
$('#zipIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)openFile(f)};
$('#pickDir').onclick=()=>$('#dirIn').click();
$('#dirIn').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;
  const m=new Map();fs.forEach(f=>{const n=f.webkitRelativePath||f.name;m.set(n,fileEntry(f,n))});
  openSource((fs[0].webkitRelativePath||'').split('/')[0]||'folder',m)};
const drop=$('#drop');
for(const ev of['dragenter','dragover'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')});
for(const ev of['dragleave','drop'])drop.addEventListener(ev,()=>drop.classList.remove('over'));
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',async e=>{e.preventDefault();if($('#start').hidden)return;const it=e.dataTransfer.items&&e.dataTransfer.items[0];
  let h=null;try{if(it&&it.getAsFileSystemHandle&&canFSA)h=await it.getAsFileSystemHandle()}catch(err){}
  if(h&&h.kind==='directory'){showErr(T('e_dir'));return}
  const f=h?await h.getFile():e.dataTransfer.files[0];if(f)openFile(f,h)});
function setLang(l){if(l!=='de'&&l!=='en')return;const a=$('#app').hidden?null:anchor();lang=l;store.set('lang',l);mkFmt();applyI18n();
  if(!$('#app').hidden&&msgs.length){refreshHeader();render();if(a){const el=document.getElementById(a.id);if(el){const s=sc();s.scrollTop+=el.getBoundingClientRect().top-s.getBoundingClientRect().top-a.off}}if(!$('#gal').hidden)renderGal()}
  showRecent()}
document.querySelectorAll('.langSel').forEach(s=>s.addEventListener('change',e=>setLang(e.target.value)));
const DEMO={de:'demo/WhatsApp-Chat mit Lena.zip',en:'demo/WhatsApp Chat - Sam.zip'};
if(/^https?:$/.test(location.protocol))fetch(DEMO.en,{method:'HEAD'}).then(r=>{if(r.ok)$('#demo').hidden=false}).catch(()=>{});
$('#demo').onclick=async()=>{try{busy(T('reading'));const r=await fetch(DEMO[lang]);if(!r.ok)throw 0;const b=await r.blob();await openFile(new File([b],DEMO[lang].split('/').pop()))}catch(e){busy('');showErr(T('e_demo'))}};
applyI18n();
showRecent();
}
</script>
</body>
</html>
